name: Build and Test Dashboard

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Omogoči ročni zagon v Actions zavihku

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/nextjs-dashboard:latest
          build-args: |
            NEXT_PUBLIC_API_URL=http://api-v-minikubu.local
            ANOTHER_VAR=nekaj-drugega

      - name: Test Docker Run
        run: |
          docker run -d --name test-container -e NEXT_PUBLIC_API_URL=test_url ${{ secrets.DOCKER_HUB_USERNAME }}/nextjs-dashboard:latest
          sleep 10
          docker ps | grep test-container
          docker logs test-container
          docker rm -f test-container